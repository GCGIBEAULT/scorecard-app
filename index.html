<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Scorecard App</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <h1>Start Your Round</h1>

  <label for="courseName">Course Name:</label>
  <input type="text" id="courseName" placeholder="e.g. Fox Hollow" />

  <label for="roundDate">Date:</label>
  <input type="text" id="roundDate" placeholder="mm / dd / yyyy" />

  <label for="handicap">Handicap:</label>
  <input type="text" id="handicap" />

  <fieldset id="stat-selector">
    <legend>Select Stats to Track:</legend>
    <label><input type="checkbox" value="Score" /> Score</label>
    <label><input type="checkbox" value="Putts" /> Putts</label>
    <label><input type="checkbox" value="GIR" /> GIR</label>
    <label><input type="checkbox" value="Fairway" /> Fairway</label>
  </fieldset>

  <button id="start-round">Start Round</button>

  <div id="top-running-status"></div>
  <div id="hole-view"></div>

  <script src="script.js"></script>
</body>
</html>
