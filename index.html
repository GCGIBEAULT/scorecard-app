<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Scorecard App</title>
  <style>
    body {
      font-family: sans-serif;
      padding: 20px;
      max-width: 600px;
      margin: auto;
    }
    label, input, button {
      display: block;
      margin: 10px 0;
    }
    fieldset {
      margin: 20px 0;
    }
    #top-running-status {
      margin-top: 20px;
      font-weight: bold;
      color: green;
    }
    #hole-view {
      margin-top: 20px;
      padding: 10px;
      background: #f0f0f0;
    }
  </style>
</head>
<body>
  <h1>Start Your Round</h1>

  <label for="courseName">Course Name:</label>
  <input type="text" id="courseName" placeholder="e.g. Fox Hollow" />

  <label for="roundDate">Date:</label>
  <input type="text" id="roundDate" placeholder="mm / dd / yyyy" />

  <label for="handicap">Handicap:</label>
  <input type="text" id="handicap" />

  <fieldset id="stat-selector">
    <legend>Select Stats to Track:</legend>
    <label><input type="checkbox" value="Score" /> Score</label>
    <label><input type="checkbox" value="Putts" /> Putts</label>
    <label><input type="checkbox" value="GIR" /> GIR</label>
    <label><input type="checkbox" value="Fairway" /> Fairway</label>
  </fieldset>

  <button id="start-round">Start Round</button>

  <div id="top-running-status"></div>
  <div id="hole-view"></div>

  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const startButton = document.getElementById("start-round");
      const statusBlock = document.getElementById("top-running-status");
      const holeView = document.getElementById("hole-view");

      if (!startButton || !statusBlock || !holeView) {
        alert("Critical elements missing. Cannot start round.");
        return;
      }

      startButton.addEventListener("click", function () {
        const courseName = document.getElementById("courseName")?.value || "Unnamed Course";
        const roundDate = document.getElementById("roundDate")?.value || "Unknown Date";
        const handicap = document.getElementById("handicap")?.value || "N/A";

        const selectedStats = Array.from(
          document.querySelectorAll("#stat-selector input[type='checkbox']:checked")
        ).map((checkbox) => checkbox.value);

        const roundData = {
          courseName,
          roundDate,
          handicap,
          selectedStats,
        };

        statusBlock.textContent = `✅ Round started at ${courseName} on ${roundDate}`;
        holeView.innerHTML = `<p>Tracking started. First hole ready.</p>`;
      });
    });
  </script>
</body>
</html>
