<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Scorecard App</title>
  <style>
    body { font-family: system-ui, sans-serif; padding: 20px; background: #f5f5f5; }
    .par-grid { display: grid; grid-template-columns: repeat(9, 1fr); gap: 6px; margin-bottom: 16px; }
    .par-input { padding: 6px; border: 1px solid #ccc; border-radius: 4px; }
    .button-group { margin-bottom: 12px; }
    .stat-button { padding: 6px 10px; margin: 4px; border-radius: 4px; border: 1px solid #bbb; background: #eee; cursor: pointer; }
    .stat-button.locked { background: #333; color: #fff; cursor: not-allowed; opacity: 0.85; }
  </style>
</head>
<body>
  <h1>Start Your Round</h1>
  <div id="top-running-status"></div>

  <label><strong>Course Name:</strong></label>
  <input id="courseName" placeholder="e.g. Fox Hollow" />
  <br><br>
  <label><strong>Date:</strong></label>
  <input id="roundDate" type="date" />
  <br><br>
  <label><strong>Handicap:</strong></label>
  <input id="handicap" type="number" />
  <br><br>

  <div id="stat-selector">
    <strong>Select Stats to Track:</strong><br>
    <label><input type="checkbox" value="score" checked /> Score</label>
    <label><input type="checkbox" value="putts" checked /> Putts</label>
    <label><input type="checkbox" value="gir" checked /> GIR</label>
    <label><input type="checkbox" value="fairway" checked /> Fairway</label>
    <br><br>
    <button type="button" onclick="startRound()">Start Round</button>
  </div>

  <section id="hole-view"></section>
  <section id="summary-block"></section>

<script>
let currentHole = 1;
const totalHoles = 18;
let selectedStats = [];
const roundData = {};

function getOptions(stat) {
  if (stat === 'score') return [1,2,3,4,5,6,7,8].map(n => ({ label: String(n), value: n }));
  if (stat === 'putts') return [0,1,2,3].map(n => ({ label: String(n), value: n }));
  if (stat === 'gir') return [{ label: 'Hit', value: true }, { label: 'X', value: false }];
  if (stat === 'fairway') return [{ label: 'Hit', value: true }, { label: 'X', value: false }];
  return [];
}

function startRound() {
  selectedStats = Array.from(document.querySelectorAll('#stat-selector input[type="checkbox"]:checked')).map(cb => cb.value);
  currentHole = 1;
  roundData.pars = {};
  renderHole(currentHole);
}

function handlePar18Commit() {
  const par18 = document.getElementById('par-18');
  if (!par18) return;

  const commit = () => {
    const raw = (par18.value || '').trim();
    const num = Number(raw);
    if (!Number.isInteger(num) || num < 3 || num > 6) return;

    roundData.pars[18] = num;
    const grid = document.querySelector('.par-grid');
    if (grid) grid.remove();

    currentHole = 1;
    renderHole(currentHole);

    const status = document.getElementById('top-running-status');
    if (status) status.textContent = `Par 18 saved: ${num}. Starting Hole 1.`;
  };

  par18.removeEventListener('blur', par18._par18Handler || (() => {}));
  par18.removeEventListener('keydown', par18._par18Key || (() => {}));

  par18._par18Handler = commit;
  par18._par18Key = function (e) {
    if (e.key === 'Enter') {
      e.preventDefault();
      commit();
      par18.blur();
    }
  };

  par18.addEventListener('blur', par18._par18Handler);
  par18.addEventListener('keydown', par18._par18Key);
}

function renderHole(hole) {
  const container = document.getElementById('hole-view');
  container.innerHTML = '';

  const grid = document.createElement('div');
  grid.className = 'par-grid';
  for (let i = 1; i <= 18; i++) {
    const inp = document.createElement('input');
    inp.className = 'par-input';
    inp.type = 'number';
    inp.min = 3;
    inp.max = 6;
    inp.placeholder = `Hole ${i}`;
    inp.id = `par-${i}`;
    if (roundData.pars[i]) inp.value = roundData.pars[i];
    grid.appendChild(inp);
  }
  container.appendChild(grid);
  handlePar18Commit();

  selectedStats.forEach(stat => {
    const group = document.createElement('div');
    group.className = 'button-group';

    const label = document.createElement('div');
    label.textContent = stat.toUpperCase();
    label.style.fontWeight = 'bold';
    group.appendChild(label);

    const options = getOptions(stat);
    options.forEach(opt => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'stat-button';
      btn.textContent = opt.label;
      btn.dataset.stat = stat;
      btn.dataset.value = String(opt.value);

      const handler = function (ev) {
        ev.preventDefault();
        ev.stopImmediatePropagation();
        if (btn.classList.contains('locked')) return;
        btn.classList.add('locked');
        btn.disabled = true;

        if (!roundData[hole]) roundData[hole] = {};
        roundData[hole][stat] = btn.dataset.value;

        const statusEl = document.getElementById('top-running-status');
        if (statusEl) statusEl.textContent = `Hole ${hole} — recorded ${stat}: ${btn.dataset.value}`;

        btn.removeEventListener('click', handler);
      };

      btn.addEventListener('click', handler);
      group.appendChild(btn);
    });

    container.appendChild(group);
  });

  const statusEl = document.getElementById('top-running-status');
  if (statusEl) statusEl.textContent = `Hole ${hole} of ${totalHoles}`;
}
</script>
</body>
</html>
