<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Scorecard App</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <h1>Start Your Round</h1>

  <div id="top-running-status" class="running-status even"></div>

  <label for="courseName"><strong>Course Name:</strong></label>
  <input type="text" id="courseName" placeholder="e.g. Fox Hollow" />
  <br><br>

  <label for="roundDate"><strong>Date:</strong></label>
  <input type="date" id="roundDate" />
  <br><br>

  <label for="handicap"><strong>Handicap:</strong></label>
  <input type="number" id="handicap" />
  <br><br>

  <div id="stat-selector">
    <strong>Select Stats to Track:</strong><br>
    <label><input type="checkbox" value="score" checked /> Score</label>
    <label><input type="checkbox" value="putts" checked /> Putts</label>
    <label><input type="checkbox" value="gir" checked /> GIR</label>
    <label><input type="checkbox" value="fairway" checked /> Fairway</label>
    <br><br>
    <button onclick="startRound()">Start Round</button>
  </div>

  <section id="hole-view"></section>
  <section id="summary-block"></section>

  <script>
    let currentHole = 1;
    const totalHoles = 18;
    let selectedStats = [];
    const roundData = {};
    let playerHandicap = null;
    let courseName = "";
    let roundDate = "";

    function startRound() {
      courseName = document.getElementById("courseName").value;
      roundDate = document.getElementById("roundDate").value;
      playerHandicap = parseInt(document.getElementById("handicap").value, 10);

      selectedStats = Array.from(document.querySelectorAll("#stat-selector input[type='checkbox']:checked"))
        .map(cb => cb.value);

      renderHole(currentHole);
    }

function renderHole(hole) {
  const container = document.getElementById("hole-view");
  container.innerHTML = "";

  // ensure Start Round (or other controls) are not treated as submit buttons
  const startBtn = document.querySelector("#stat-selector button");
  if (startBtn) startBtn.type = "button";

  selectedStats.forEach(stat => {
    const group = document.createElement("div");
    group.className = "button-group";

    const label = document.createElement("div");
    label.textContent = stat.toUpperCase();
    label.style.fontWeight = "bold";
    group.appendChild(label);

    const options = getOptions(stat);
    options.forEach(opt => {
      const btn = document.createElement("button");
      btn.type = "button"; // critical: prevent implicit form submit/navigation
      btn.className = "stat-button";
      btn.textContent = opt.label;
      btn.dataset.stat = stat;
      // keep a clean value to record; prefer numeric/value if present
      btn.dataset.value = (opt.value !== undefined) ? String(opt.value) : String(opt.label);

      // attach immutable handler at creation
      const handler = function (ev) {
        // stop anything else from reacting to this click
        ev.preventDefault();
        ev.stopImmediatePropagation();

        // if already locked, do nothing
        if (btn.classList.contains("locked")) return false;

        // visually lock and disable
        btn.classList.add("locked");
        btn.disabled = true;

        // record stat into roundData immediately (adjust shape if needed)
        if (!roundData[hole]) roundData[hole] = {};
        roundData[hole][stat] = btn.dataset.value;

        // optional: update running status or summary in place
        document.getElementById("top-running-status").textContent =
          `Hole ${currentHole} of ${totalHoles} — recorded ${stat}: ${btn.dataset.value}`;

        // ensure this click never triggers any global "advance" logic
        // do NOT call advanceHole() or similar here; advance should be explicit elsewhere
        btn.removeEventListener("click", handler);
        return false;
      };

      btn.addEventListener("click", handler);
      group.appendChild(btn);
    });

    container.appendChild(group);
  });

  // update visible top status without changing structure
  const statusEl = document.getElementById("top-running-status");
  if (statusEl) statusEl.textContent = `Hole ${hole} of ${totalHoles}`;

  // ensure no rogue form submit or global click handler will advance hole accidentally
  // add a short-circuit global click stopper only while hole UI is active
  // this prevents other delegated listeners from interpreting stat clicks as "advance"
  const globalGuard = function (ev) {
    // if click originated inside our hole-view, stop propagation to external handlers
    if (document.getElementById("hole-view") && document.getElementById("hole-view").contains(ev.target)) {
      ev.stopImmediatePropagation();
      // don't preventDefault globally so other non-conflicting behavior remains
    }
  };
  // attach once; remove after a short delay so it doesn't persist unnecessarily
  window.addEventListener("click", globalGuard, true);
  setTimeout(() => window.removeEventListener("click", globalGuard, true), 500);

  // ensure capitalization/labels match design: if you want lowercase labels, map them here
  // (left capitalized to match repo styling; change if you prefer)
}

    function getOptions(stat) {
      if (stat === "score") return [
        { label: "1" }, { label: "2" }, { label: "3" }, { label: "4" },
        { label: "5" }, { label: "6" }, { label: "7" }, { label: "8" }
      ];
      if (stat === "putts") return [
        { label: "0" }, { label: "1" }, { label: "2" }, { label: "3" }
      ];
      if (stat === "gir") return [
        { label: "Hit" }, { label: "X" }
      ];
      if (stat === "fairway") return [
        { label: "Hit" }, { label: "X" }
      ];
      return [];
    }
  </script>
</body>
</html>
